{% macro form_field(
  field_name,
  field_schema,
  value=None,
  validated=False,
  error=None,
  is_required=False) %}
  <div class="form-floating mb-3 {% if validated %}has-validation{% endif %}">
    <input
      type="text"
      {% if validated %}
      class="form-control {% if error %}is-invalid{% else %}is-valid{% endif %}"
      {% else %}
      class="form-control"
      {% endif %}
      id="{{ field_name }}"
      name="{{ field_name }}"
      placeholder="{{ field_schema.title }}"
      {% if field_schema.get('minLength') != None %}
      minlength="{{ field_schema.minLength }}"
      {% endif %}
      {% if field_schema.get('maxLength') != None %}
      maxlength="{{ field_schema.maxLength }}"
      {% endif %}
      {% if value != None %}
      value="{{ value }}"
      {% endif %}
      {% if is_required %}required{% endif %}
    >
    {% if validated %}
      {% if error %}
        <div class="invalid-feedback">{{ error }}</div>
      {% endif %}
    {% endif %}
    <label
      for="{{ field_name }}"
    >{{ field_schema.title }}</label>
  </div>
{% endmacro %}
